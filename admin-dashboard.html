<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <button id="deleteEmployeeBtn" class="danger-btn">Delete Employee Data</button>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-dashboard">
        <aside class="sidebar">
            <div class="user-profile">
                <img id="adminAvatar" src="images/admin-avatar.jpg" alt="Admin">
                <h4 id="adminName">Admin Name</h4>
                <p id="adminRole">Administrator</p>
            </div>
            
            <nav class="nav-menu">
                <ul>
                    <li class="active"><a href="#dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="#search-employee"><i class="fas fa-search"></i> Search Employee</a></li>
                    <li><a href="#attendance"><i class="fas fa-calendar-check"></i> Employee Attendance</a></li>
                    <li><a href="#leave"><i class="fas fa-calendar-minus"></i> Leave Requests</a></li>
                    <li><a href="#shifts"><i class="fas fa-clock"></i> Shift Management</a></li>
                    <li><a href="#employees"><i class="fas fa-users"></i> Employee Directory</a></li>
                    <li><a href="index.html" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h2>Dashboard Overview</h2>
            </header>
            
            <div id="searchEmployeeSection" class="section">
                <h3>Search Employee</h3>
                <div class="search-form">
                    <input type="number" id="empIdSearch" placeholder="Enter Employee ID">
                    <button id="searchEmployeeBtn" class="primary-btn">Search</button>
                </div>
            </div>
            
            <div id="employeeDetailsSection" class="section" style="display: none;">
                <h3>Employee Details</h3>
                <div id="employeeDetails"></div>
                <div class="action-buttons">
                    <button id="viewAttendanceBtn" class="primary-btn">View Attendance</button>
                    <button id="viewLeavesBtn" class="primary-btn">View Leave Requests</button>
                    <button id="viewShiftsBtn" class="primary-btn">View Shifts</button>
                    <button id="generateReportBtn" class="primary-btn">Generate Report</button>
                </div>
            </div>
            
            <div id="resultsSection" class="section" style="display: none;">
                <h3>Results</h3>
                <div id="resultsContent"></div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
