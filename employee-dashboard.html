<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="employee-dashboard">
        <aside class="sidebar">
            <div class="user-profile">
                <img id="employeeAvatar" src="images/employee-avatar.jpg" alt="Employee">
                <h4 id="employeeName">Employee Name</h4>
                <p id="employeeDepartment">Department</p>
            </div>
            
            <nav class="nav-menu">
                <ul>
                    <li class="active"><a href="#dashboard"><i class="fas fa-home"></i> My Dashboard</a></li>
                    <li><a href="#attendance"><i class="fas fa-calendar-alt"></i> My Attendance</a></li>
                    <li><a href="#leave"><i class="fas fa-umbrella-beach"></i> Leave Application</a></li>
                    <li><a href="#profile"><i class="fas fa-user-cog"></i> My Profile</a></li>
                    <li><a href="index.html" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h2>My Dashboard</h2>
            </header>
            
            <div class="employee-stats">
                <div class="stat-card">
                    <h3 id="attendancePercentage">95%</h3>
                    <p>Monthly Attendance</p>
                </div>
                <div class="stat-card">
                    <h3 id="pendingLeaves">2</h3>
                    <p>Pending Leaves</p>
                </div>
            </div>
            
            <div class="section">
                <h3>My Details</h3>
                <div id="employeePersonalDetails"></div>
            </div>
            
            <div class="section">
                <h3>Quick Actions</h3>
                <div class="action-buttons">
                    <button id="viewMyAttendanceBtn" class="primary-btn">View My Attendance</button>
                    <button id="applyLeaveBtn" class="primary-btn">Apply for Leave</button>
                    <button id="viewMyShiftsBtn" class="primary-btn">View My Shifts</button>
                </div>
            </div>

            <!-- Added results section -->
            <div id="resultsSection" class="section" style="display: none;">
                <div class="section-header">
                    <h3 id="resultsTitle">Results</h3>
                    <button id="closeResultsBtn" class="secondary-btn">Close</button>
                </div>
                <div id="resultsContent"></div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
