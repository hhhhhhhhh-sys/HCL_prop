<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Employee Login</h2>
            <form id="employeeLoginForm">
                <div class="form-group">
                    <label for="employeeUsername">Username (Email)</label>
                    <input type="email" id="employeeUsername" required>
                </div>
                <div class="form-group">
                    <label for="employeePassword">Password</label>
                    <input type="password" id="employeePassword" required>
                </div>
                <button type="submit" class="primary-btn">Login</button>
                <button type="button" id="employeeBackButton" class="secondary-btn">Back</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
