<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Project - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <div class="landing-container">
        <div class="landing-backdrop-effect" aria-hidden="true"></div>
        <header class="landing-header">
            <h1>Attendance Pro</h1>
            <p>People, present and accounted for.</p>
        </header>
        
        <div class="auth-card animate__animated animate__fadeInUp">
            <div class="logo">
                <img src="images/company_logo.png" alt="Company Logo">
            </div>
            <p class="auth-kicker">YOUR WORKFORCE, IN ONE PLACE</p>
            <h2>Welcome back.</h2>
            <p class="auth-copy">Sign in to manage your day.</p>
            
            <button id="signInButton" class="primary-btn">
                <i class="fas fa-arrow-right-to-bracket"></i> Choose your workspace
            </button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
